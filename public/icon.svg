<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#0a0c14"/>
    </linearGradient>

    <!-- Vibrant Red-to-Ruby Gradient -->
    <linearGradient id="mRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b5c"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Amber / Lightning Accent Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Subtle Ring/Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="mGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#e11d48" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base App Tile Canvas -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="14" y="14" width="484" height="484" rx="106" fill="none" stroke="url(#borderGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Geometric Abstract Remote Display / Portal -->
  <!-- Outer Shield Monitor Frame -->
  <g filter="url(#mGlow)">
    <!-- Distinctive Geometric Monogram 'M' with Remote Cross-link Beam -->
    <!-- Left Pillar of 'M' (Stylized Node) -->
    <path d="M 112 340 L 112 172 C 112 152, 128 136, 148 136 C 168 136, 184 152, 184 172 L 184 270 L 230 200 C 242 182, 270 182, 282 200 L 328 270 L 328 172 C 328 152, 344 136, 364 136 C 384 136, 400 152, 400 172 L 400 340 C 400 358, 384 372, 366 372 C 350 372, 336 360, 332 344 L 328 296 L 272 374 C 263 386, 249 386, 240 374 L 184 296 L 180 344 C 176 360, 162 372, 146 372 C 128 372, 112 358, 112 340 Z" fill="url(#mRedGrad)"/>
  </g>

  <!-- Futuristic High-Speed Signal Wave / Cyber Orbit (Symbolizing Screen Broadcast) -->
  <path d="M 130 115 C 210 70, 302 70, 382 115" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-dasharray="14 12" opacity="0.85"/>
  <circle cx="382" cy="115" r="7" fill="#38bdf8"/>
  <circle cx="130" cy="115" r="5" fill="#38bdf8" opacity="0.6"/>

  <!-- High-Precision Center Node Spark -->
  <circle cx="256" cy="272" r="14" fill="#ffffff" filter="url(#mGlow)"/>
  <circle cx="256" cy="272" r="7" fill="#0ea5e9"/>

  <!-- Brand Typography -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="6">MEH DESK</text>
  <text x="256" y="475" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" text-anchor="middle" letter-spacing="3">ULTRA REMOTE</text>
</svg>
