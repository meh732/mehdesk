<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141722"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#ef4444" stroke-width="6" stroke-opacity="0.3"/>
  
  <!-- Intersecting Remote Diamond/Display Screen Shape -->
  <g transform="translate(106, 106)">
    <!-- Monitor Base & Screen -->
    <rect x="20" y="20" width="260" height="180" rx="24" fill="#1e2230" stroke="#334155" stroke-width="8"/>
    <rect x="36" y="36" width="228" height="148" rx="14" fill="#0f1118"/>
    
    <!-- Red Remote Diamond Symbol (meh desk brand mark) -->
    <path d="M150 45 L205 110 L150 175 L95 110 Z" fill="url(#redGrad)" filter="url(#glow)"/>
    <path d="M150 72 L182 110 L150 148 L118 110 Z" fill="#ffffff" opacity="0.9"/>
    
    <!-- Lightning connection pulse -->
    <circle cx="150" cy="110" r="10" fill="#ef4444"/>
    
    <!-- Monitor Stand -->
    <path d="M130 200 L170 200 L185 240 L115 240 Z" fill="#334155"/>
    <rect x="90" y="240" width="120" height="14" rx="7" fill="#475569"/>
    
    <!-- Status Indicator -->
    <circle cx="240" cy="48" r="6" fill="#10b981"/>
  </g>
  
  <!-- Brand text "meh" -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="4">MEH DESK</text>
</svg>
