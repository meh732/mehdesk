[package]
name = "mehdesk-portable"
version = "9.0.0"
description = "meh desk Enterprise Remote Desktop - Windows Standalone Portable Client (.exe)"
authors = ["meh desk Team"]
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
