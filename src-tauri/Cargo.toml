[package]
name = "anydesk-remote-portable"
version = "8.5.0"
description = "AnyDesk Enterprise Remote Hub - Standalone Ultra-Lightweight Tauri Desktop Client"
authors = ["AnyDesk Enterprise Team"]
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
